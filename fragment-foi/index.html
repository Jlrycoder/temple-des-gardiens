<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fragment de la Foi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px 50px;
      background: #080605;
      color: #d9b66a;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }

    h1 {
      margin: 20px 0 15px;
      font-size: clamp(32px, 8vw, 60px);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .ouvert {
      margin: 0 0 35px;
      font-size: clamp(20px, 5vw, 32px);
      letter-spacing: 2px;
    }

    .fragment {
      display: block;
      width: 100%;
      max-width: 700px;
      height: auto;
      margin: 0 auto;
      border: 4px solid #d9b66a;
      box-shadow: 0 0 30px rgba(217, 182, 106, 0.25);
    }
  </style>
</head>

<body>

  <h1>Fragment de la Foi</h1>

  <p class="ouvert">Le fragment a été ouvert.</p>

  <img
    class="fragment"
    src="assets/fragment-foi.png"
    alt="Fragment de la Foi"
  >

</body>
</html>
