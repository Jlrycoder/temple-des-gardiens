      <!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#080604"
  >

  <title>Fragment de la Curiosité</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- Écran de chargement -->
  <div id="loading">

    <div class="loading-symbol">✦</div>

    <div class="loading-title">
      LES ARCHIVES DU CODEX
    </div>

    <div class="loading-text">
      Révélation du Fragment...
    </div>

  </div>


  <!-- Scène Three.js -->
  <div id="scene"></div>


  <!-- Interface -->
  <div id="interface">

    <header>

      <div class="eyebrow">
        LES ARCHIVES DU CODEX
      </div>

      <h1>
        FRAGMENT DE LA
        <br>
        <span>CURIOSITÉ</span>
      </h1>

    </header>


    <div class="instruction">
      Fais glisser ton doigt pour observer
      <span>•</span>
      Pince pour zoomer
    </div>

  </div>


  <!-- Moteur Three.js -->
  <script
    type="module"
    src="app.js"
  ></script>

</body>

</html>
